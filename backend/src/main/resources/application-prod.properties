# Production profile — H2 embedded file database (no MySQL needed)
# The datasource URL is overridden at runtime by Electron with the correct user-data path.
spring.datasource.url=jdbc:h2:file:./data/pointage;MODE=MySQL;AUTO_SERVER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Server
server.port=8080
